name: FinServ Blog Bot

on:
  schedule:
    # Tuesdays at 13:00 UTC (~8/9am ET)
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      angle:
        description: "Story angle to draft"
        required: false
        default: "multicultural-loyalty"
        type: choice
        options:
          - multicultural-loyalty
          - ai-governance
          - sports-finance-signals
      max_age_days:
        description: "Only consider news pegs newer than N days"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run blog bot tests
        run: python test_blog_bot.py
        working-directory: bot

      - name: Draft a sourced post
        run: >
          python bot/finserv_blog_bot.py
          --out-dir blog
          --angle ${{ github.event.inputs.angle || 'multicultural-loyalty' }}
          --max-age-days ${{ github.event.inputs.max_age_days || '30' }}

      - name: Commit and push draft
        run: |
          git config user.name "finserv-blog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FinServ blog draft ($(date -u +%Y-%m-%d))"
            git push
          fi
