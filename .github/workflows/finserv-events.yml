name: FinServ Events Bot

on:
  schedule:
    # Mondays and Thursdays at 12:00 UTC (~7/8am ET)
    - cron: "0 12 * * 1,4"
  workflow_dispatch:
    inputs:
      max_price:
        description: "Max minimum-ticket price (USD)"
        required: false
        default: "150"
      days:
        description: "Look-ahead window (days)"
        required: false
        default: "75"
      debug:
        description: "Upload fetched page bodies as an artifact"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python test_parsers.py
        working-directory: bot

      - name: Scan for events
        run: >
          python bot/finserv_events_bot.py
          --out-dir events
          --max-price ${{ github.event.inputs.max_price || '150' }}
          --days ${{ github.event.inputs.days || '75' }}
          ${{ github.event.inputs.debug == 'true' && '--debug-dump debug-pages' || '' }}

      - name: Upload debug page dumps
        if: github.event.inputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug-pages/
          if-no-files-found: warn

      - name: Print debug excerpts to log
        if: github.event.inputs.debug == 'true'
        run: |
          python - <<'EOF'
          import json, re
          from pathlib import Path
          for p in sorted(Path("debug-pages").glob("*.txt")):
              body = p.read_text("utf-8", errors="replace")
              print(f"\n===== {p.name} ({len(body)} chars) =====")
              if body.lstrip().startswith("{"):
                  try:
                      data = json.loads(body)
                      evs = data.get("events") or []
                      print("top-level keys:", sorted(data.keys()))
                      if evs:
                          print("first entry:",
                                json.dumps(evs[0], indent=1)[:2500])
                  except Exception as e:
                      print("json parse failed:", e)
              else:
                  m = re.search(r"/events?/", body)
                  if m:
                      s = max(0, m.start() - 400)
                      print(body[s:m.start() + 1600])
                  else:
                      print(body[:1200])
          EOF

      - name: Commit and push results
        run: |
          git config user.name "finserv-events-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FinServ events digest ($(date -u +%Y-%m-%d))"
            git push
          fi
